  const lo=S.pmin===""?-Infinity:+S.pmin,hi=S.pmax===""?Infinity:+S.pmax;
  let out=P.filter(p=>{
    if(!S.cases.has(p.case))return false;
    if(S.vendor&&p.vid!==S.vendor)return false;
    if(S.unit&&p.unit!==S.unit)return false;
    if(S.cat&&!p.cats.includes(S.cat))return false;
    if(S.agent&&val(p,"agent")!==S.agent)return false;
    if(p.price<lo||p.price>hi)return false;
    const e=ed(p);
    if(S.has==="photo"&&!e.photo)return false;if(S.has==="nophoto"&&e.photo)return false;
    const bs=bidInfo(p).src;
    if(S.has==="bid"&&(bs===""||bs==="none"))return false;if(S.has==="nobid"&&!(bs===""||bs==="none"))return false;
    if(S.has==="auto"&&bs!=="auto")return false;if(S.has==="bidok"&&!(bs==="picked"||bs==="manual"))return false;if(S.has==="mismatch"){const r=calc(p);if(!r||r.ok)return false}
    if(S.has==="note"&&!val(p,"note"))return false;
    if(toks.length){const h=hay(p,S.field).toLowerCase();if(!toks.every(t=>h.includes(t)))return false}
    return true});
  const {k,dir}=S.sort;
  out.sort((a,b)=>{let x=val(a,k),y=val(b,k);const num=["price","cprice","bid","wt"].includes(k);
    if(num){x=x===""?Infinity:+x;y=y===""?Infinity:+y;return (x-y)*dir||cmpDefault(a,b)}
    if(k==="case"&&x===y)return cmpDefault(a,b);
    return String(x).localeCompare(String(y),"zh-Hant")*dir||cmpDefault(a,b)});
  return out}
function cmpDefault(a,b){return a.case.localeCompare(b.case)||a.no-b.no}

function render(){
  const rows=filtered();const pages=Math.max(1,Math.ceil(rows.length/PAGE));if(S.page>pages)S.page=pages;
  $("count").textContent=`共 ${rows.length.toLocaleString()} 項`;
  const slice=rows.slice((S.page-1)*PAGE,S.page*PAGE);
  $("tbody").innerHTML=slice.length?slice.map(p=>{const e=ed(p);const note=val(p,"note");
    return `<tr class="row" tabindex="0" data-key="${p.key}">
    <td>${e.photo?`<img class="thumb" alt="" loading="lazy" src="${esc(photoSrc(e.photo))}">`:`<span class="nophoto">無照</span>`}</td>
    <td class="mono"><button class="link" data-act="case" data-v="${p.case}">${p.case}</button></td>
    <td class="mono"><button class="link" data-act="vendor" data-v="${p.vid}">${p.vid}</button></td>
    <td><button class="link" data-act="vendor" data-v="${p.vid}">${esc(p.vname)}</button></td>
    <td class="mono">${p.bc}</td><td class="name">${esc(p.name)}</td><td class="needtd">${esc(shortNeed(needOf(p)))}</td><td>${esc(p.spec)}</td><td>${esc(p.unit)}</td>
    <td class="num">${fmt(p.price)}${(r=>r&&!r.ok?`<div class="autotag warn">計算 ${r.s}</div>`:"")(calc(p))}</td><td class="num">${(r=>r?r.c.toFixed(2):`<span class="est" title="尚無決標價，以售價÷1.05推估">≈${(p.price/1.05).toFixed(2)}</span>`)(calc(p))}</td>
    <td class="num bidtd">${bidCell(p)}</td>
    <td class="mono">${p.start}</td><td>${esc(e.agent||"")}</td>
    <td>${note?`<span class="pill${/管制/.test(note)?" warn":""}">${esc(note.length>12?note.slice(0,12)+"…":note)}</span>`:""}</td></tr>`}).join("")
    :`<tr><td colspan="15" class="empty">沒有符合條件的品項。試著減少關鍵字或按「清除條件」。</td></tr>`;
  document.querySelectorAll("th[data-sort]").forEach(th=>{th.classList.toggle("asc",th.dataset.sort===S.sort.k&&S.sort.dir===1);th.classList.toggle("desc",th.dataset.sort===S.sort.k&&S.sort.dir===-1)});
  // pager
  let pg="";if(pages>1){pg+=`<button data-pg="${S.page-1}" ${S.page===1?"disabled":""}>上一頁</button>`;
    const set=new Set([1,pages,S.page-1,S.page,S.page+1,S.page-2,S.page+2].filter(n=>n>=1&&n<=pages));let last=0;
    [...set].sort((a,b)=>a-b).forEach(n=>{if(n-last>1)pg+="<span>…</span>";pg+=`<button data-pg="${n}" ${n===S.page?'class="primary"':""}>${n}</button>`;last=n});
    pg+=`<button data-pg="${S.page+1}" ${S.page===pages?"disabled":""}>下一頁</button>`}
  $("pager").innerHTML=pg;
  // active tags
  const tags=[];if(S.q)tags.push(["q",`關鍵字：${S.q}`]);if(S.vendor){const v=P.find(p=>p.vid===S.vendor);tags.push(["vendor",`廠商：${v.vname}`])}
  if(S.agent)tags.push(["agent",`代理商：${S.agent}`]);if(S.cat)tags.push(["cat",`品類：${S.cat}`]);if(S.unit)tags.push(["unit",`單位：${S.unit}`]);
  if(S.cases.size<CASES.length)tags.push(["cases",`案號：${[...S.cases].join("、")||"（未選）"}`]);
  if(S.pmin!==""||S.pmax!=="")tags.push(["price",`售價 ${S.pmin||0}–${S.pmax||"∞"}`]);if(S.has)tags.push(["has",$("has").selectedOptions[0].text]);
  $("active").innerHTML=tags.map(([k,t])=>`<button class="tag" data-clear="${k}" title="移除此條件">${esc(t)} ✕</button>`).join("");
  renderStats();}

function bidCell(p){const b=bidInfo(p);
  if(p.opts&&db&&canWrite){const cur=b.o?b.o.item:(b.src==="manual"?"__manual":"");
    return `<select class="bidsel ${b.src}" data-key="${p.key}" aria-label="${esc(p.name)} 決標價">
      <option value="">— 未選 —</option>${p.opts.map(o=>`<option value="${o.item}"${o.item===cur?" selected":""}>${esc(optLabel(o,p))}</option>`).join("")}
      ${b.src==="manual"?`<option value="__manual" selected>自填 ${fmt(b.v)} 元</option>`:""}</select>${b.src==="auto"?`<div class="autotag">${(r=>r&&r.ok?"自動帶入・售價吻合":"自動帶入・待確認")(calc(p))}</div>`:""}${(r=>r&&!r.ok&&b.src!=="auto"?'<div class="autotag warn">售價不符</div>':"")(calc(p))}`}
  if(b.v==="")return p.opts?`<span class="autotag">${p.opts.length} 個得標項次可選</span>`:'<span style="color:var(--muted)">—</span>';
  return `${fmt(b.v)}${b.o?`<div class="autotag">${b.o.item} ${esc(shortNeed(b.o.need))}${b.src==="auto"?"・自動帶入":""}</div>`:""}`}
async function pickBid(p,v){if(v==="__manual")return;
  const patch=v?{bidItem:v,bid:null,bidNone:null}:{bidItem:null,bid:null,bidNone:true};
  try{await writeItem(p,patch);toast(v?`已帶入決標價 ${p.opts.find(o=>o.item===v).price.toFixed(2)} 元`:"已清除決標價")}
  catch(err){toast(err&&err.code==="invalid_argument"?"你沒有寫入權限":"儲存失敗，請稍後再試")}
  render();if(openKey===p.key)openPanel(p.key)}
function renderStats(){
  const vendors=new Set(P.map(p=>p.vid)).size;let ph=0;EDIT.forEach(e=>{if(e.photo)ph++});
  let ok=0,au=0,mm=0;P.forEach(p=>{const s=bidInfo(p).src;if(s==="picked"||s==="manual")ok++;else if(s==="auto")au++;const r=calc(p);if(r&&!r.ok)mm++});
  $("stats").innerHTML=`<div class="stat">品項<b>${P.length.toLocaleString()}</b></div><div class="stat">採購案<b>${CASES.length}</b></div><div class="stat">廠商<b>${vendors}</b></div><div class="stat">已有照片<b>${ph}</b></div><div class="stat">決標價已確認<b>${ok}</b></div><div class="stat">自動帶入待確認<b>${au}</b></div><div class="stat">售價計算不符<b>${mm}</b></div>`}

function buildFilters(){
  $("caseBox").innerHTML=CASES.map(c=>{const n=P.filter(p=>p.case===c.case).length;return `<label class="case-opt"><input type="checkbox" id="c-${c.case}" value="${c.case}" checked><span><b class="mono">${c.case}</b> <small>${esc(c.title)} · ${n} 項 · 起供 ${c.start}</small></span></label>`}).join("");
  const vmap=new Map();P.forEach(p=>{const v=vmap.get(p.vid)||{name:p.vname,n:0};v.n++;vmap.set(p.vid,v)});
  $("vendor").innerHTML='<option value="">全部廠商</option>'+[...vmap].sort((a,b)=>a[1].name.localeCompare(b[1].name,"zh-Hant")).map(([id,v])=>`<option value="${id}">${esc(v.name)}（${id}）· ${v.n}</option>`).join("");
  const units=[...new Set(P.map(p=>p.unit))];$("unit").innerHTML='<option value="">全部單位</option>'+units.map(u=>`<option>${esc(u)}</option>`).join("");
  $("cats").innerHTML=CATS.map(([n])=>`<button type="button" class="chip" aria-pressed="false" data-cat="${n}">${n}</button>`).join("");
  buildAgents()}
function buildAgents(){const a=[...new Set([...EDIT.values()].map(e=>e.agent).filter(Boolean))].sort((x,y)=>x.localeCompare(y,"zh-Hant"));
  const cur=S.agent;$("agentSel").innerHTML='<option value="">全部</option>'+a.map(x=>`<option ${x===cur?"selected":""}>${esc(x)}</option>`).join("");
  $("agentList")&&($("agentList").innerHTML=a.map(x=>`<option value="${esc(x)}">`).join(""))}

function syncCats(){document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.cat===S.cat)))}
function setAndRender(){S.page=1;render()}

$("tbody").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr.row")&&!e.target.closest("select"))openPanel(e.target.dataset.key)});
function applyQuick(act,v){if(act==="vendor"){S.vendor=v;$("vendor").value=v}
  else if(act==="case"){S.cases=new Set([v]);document.querySelectorAll("#caseBox input").forEach(i=>i.checked=i.value===v)}
  else if(act==="cat"){S.cat=v;syncCats()}
  else if(act==="agent"){S.agent=v;buildAgents();$("agentSel").value=v}
  else if(act==="name"){S.q=v;S.field="name";$("q").value=v;$("field").value="name"}
  closePanel();setAndRender();window.scrollTo({top:0,behavior:"smooth"})}

function docRef(p){return db.collection("cases").doc(p.case).collection("items").doc(String(p.no))}
async function writeItem(p,patch){const cur={...ed(p)};const next={...cur,...patch};
  Object.keys(next).forEach(k=>{if(next[k]===""||next[k]==null)delete next[k]});
  if(LOCAL){if(Object.keys(next).length)await IDB.put(p.key,next);else await IDB.del(p.key)}else await docRef(p).set(next);
  if(Object.keys(next).length)EDIT.set(p.key,next);else EDIT.delete(p.key)}
async function save(p){const btn=$("f-save");btn.disabled=true;btn.textContent="儲存中…";
  try{const bidRaw=$("f-bid").value.trim();const patch={bid:bidRaw===""?null:Number(bidRaw),agent:$("f-agent").value.trim(),note:$("f-note").value.trim(),wt:$("f-wt").value.trim()===""?null:Number($("f-wt").value),need:$("f-need").disabled?(ed(p).need??null):$("f-need").value.trim()};
    const bs=$("f-bidsel");
    if(bs){if(bs.value==="__manual"){patch.bidItem=null;patch.bidNone=patch.bid==null?true:null}
      else if(bs.value){patch.bidItem=bs.value;patch.bid=null;patch.bidNone=null}
      else{patch.bidItem=null;patch.bid=null;patch.bidNone=true}}
    if(patch.note===p.note0)patch.note=null;
    const file=$("f-photo")?.files?.[0];
    if(file){btn.textContent="上傳照片中…";if(LOCAL)patch.photo=await fileToSmallJpeg(file);else{const r=await assets.upload(file,{type:file.type||"image/jpeg"});patch.photo=r.id}}
    await writeItem(p,patch);
    if($("f-all").checked&&patch.agent){const others=P.filter(x=>x.vid===p.vid&&x.key!==p.key);let i=0;
      for(const x of others){i++;btn.textContent=`套用代理商 ${i}/${others.length}`;if(ed(x).agent!==patch.agent)await writeItem(x,{agent:patch.agent})}}
    toast("已儲存");buildAgents();render();openPanel(p.key)}
  catch(err){btn.disabled=false;btn.textContent="儲存";
    const c=err&&err.code;toast(c==="too_large"?"照片超過 20MB，請壓縮後再上傳":c==="unsupported_type"?"照片格式不支援，請用 JPG、PNG 或 WebP":c==="invalid_argument"?"你沒有寫入權限":c==="quota_exceeded"||c==="quota_or_state"?"儲存空間已滿":"儲存失敗，請稍後再試")}}
async function removePhoto(p){const id=ed(p).photo;if(!id)return;try{await writeItem(p,{photo:null});if(!LOCAL)try{await assets.delete(id)}catch(_){}
  toast("已移除產品照");render();openPanel(p.key)}catch(_){toast("移除失敗，請稍後再試")}}

// ---- CSV export
$("export").addEventListener("click",async()=>{const rows=filtered();
  const head=["採購案號","採購案名","項次","廠商編號","廠商簡稱","商品條碼","商品名","規格","計量單位","售價(元)","契約價(決標價×重量)","決標價/100g或ml","決標項次","需求商品名","決標價來源","計價重量g","計算售價","售價吻合","產品照","起供日","備註","代理商"];
  const SRC={picked:"已確認",manual:"自行填寫",auto:"自動帶入待確認",none:"",'':""};
  const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[head,...rows.map(p=>{const e=ed(p);return [p.case,p.title,p.no,p.vid,p.vname,"\t"+p.bc,p.name,p.spec,p.unit,p.price,(r=>r?r.c.toFixed(2):"")(calc(p)),(b=>b.v)(bidInfo(p)),(b=>b.o?b.o.item:"")(bidInfo(p)),needOf(p),SRC[bidInfo(p).src],wt(p)||"",(r=>r?r.s:"")(calc(p)),(r=>r?(r.ok?"是":"否"):"")(calc(p)),e.photo?"有":"",p.start,val(p,"note"),e.agent||""]})].map(r=>r.map(q).join(","));
  if(LOCAL){saveBlob("副供大宗雜貨查詢結果.csv","﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");return}
  try{await downloads.save({filename:"副供大宗雜貨查詢結果.csv",data:"﻿"+lines.join("\r\n")})}catch(err){if(err&&err.code!=="cancelled"&&err.code!=="declined")toast("無法下載檔案")}});

// ---- boot
buildFilters();render();
if(LOCAL)(async()=>{
  db={local:true};assets={local:true};$("export").hidden=false;$("backupBox").hidden=false;
  try{(await IDB.all()).forEach(([k,v])=>EDIT.set(k,v));$("sync").textContent="· 填寫資料存在這台電腦的瀏覽器，點任一列可填寫"}
  catch(_){db=null;assets=null;$("sync").textContent="（這個瀏覽器無法儲存填寫資料，目前僅供查詢）"}
  buildAgents();render();
})();
$("backupOut").addEventListener("click",()=>{const o={};EDIT.forEach((v,k)=>o[k]=v);saveBlob(`副供查詢填寫資料備份-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:"fugong-search",v:1,items:o}),"application/json");toast(`已匯出 ${EDIT.size} 筆`)});
$("backupIn").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const items=j.items||{};let n=0;
  for(const [k,v] of Object.entries(items)){if(!BYKEY.has(k)||typeof v!=="object")continue;const merged={...(EDIT.get(k)||{}),...v};await IDB.put(k,merged);EDIT.set(k,merged);n++}
  toast(`已匯入 ${n} 筆`);buildAgents();render()}catch(_){toast("檔案格式不對，請選擇本網站匯出的備份 JSON")}e.target.value=""});
if(!LOCAL)(async()=>{
  try{db=await claude.use("db")}catch(_){db=null}
  if(!db){$("sync").textContent="（唯讀：決標價、照片等填寫資料需登入後顯示）";return}
  try{const u=await claude.use("user");if(u){const w=await u.can("data.write");if(w===false)canWrite=false}}catch(_){}
  claude.use("assets").then(a=>{assets=a;if(openKey)openPanel(openKey)}).catch(()=>{});
  claude.use("downloads").then(d=>{downloads=d;$("export").hidden=!d}).catch(()=>{});
  let loaded=0;
  CASES.forEach(c=>{db.collection("cases").doc(c.case).collection("items").onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{const k=c.case+"-"+ch.doc.id;if(ch.type==="removed")EDIT.delete(k);else EDIT.set(k,{...ch.doc.data()})});
      if(!snap.metadata.fromCache)loaded++;
      $("sync").textContent=canWrite?"· 已同步，點任一列可填寫":"· 已同步（唯讀）";
      buildAgents();render();if(openKey&&!$("panel").contains(document.activeElement))openPanel(openKey)},
    ()=>{$("sync").textContent="· 填寫資料暫時無法同步"})});
})();
</script>
